name: papikost_mobile
description: "PapiKost Mobile - Aplikasi Pencarian dan Manajemen Kost"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage & Auth
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Image
  image_picker: ^1.1.2

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.5.1

  # Navigation
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
